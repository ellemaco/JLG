<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signup - Just A Little Goodness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            color: white;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
        }
        
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-intro {
            color: #666;
            font-size: 1em;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        .required {
            color: #d32f2f;
            margin-left: 4px;
        }
        
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input[type="text"]:invalid:not(:placeholder-shown),
        input[type="email"]:invalid:not(:placeholder-shown) {
            border-color: #d32f2f;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .optional-label {
            color: #999;
            font-size: 0.85em;
            font-weight: 400;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }
        
        .submit-btn,
        .home-btn {
            flex: 1;
            padding: 14px 30px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        
        .submit-btn {
            background: #667eea;
            color: white;
        }
        
        .submit-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .home-btn {
            background: #f0f0f0;
            color: #333;
        }
        
        .home-btn:hover {
            background: #e0e0e0;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            font-weight: 500;
            text-align: center;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .form-container {
            transition: opacity 0.3s ease;
        }
        
        .form-container.hidden {
            display: none;
        }
        
        .success-message {
            text-align: center;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .success-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .success-message h2 {
            color: #155724;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        
        .success-message p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.05em;
        }
        
        .back-home-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: background 0.3s ease;
        }
        
        .back-home-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📧 Email Signup</h1>
        <p class="subtitle">Receive the latest pages by email</p>
    </div>
    
    <div class="container">
        <div class="form-container" id="formContainer">
            <p class="form-intro">Join our mailing list to receive our latest pages and updates. We promise not to spam you!</p>
            
            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">
                            First Name
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="John"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Doe"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">
                        Email Address
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="john@example.com"
                        required
                    >
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">
                            City
                            <span class="optional-label">(Optional)</span>
                        </label>
                        <input 
                            type="text" 
                            id="city" 
                            name="city" 
                            placeholder="New York"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="state">
                            State
                            <span class="optional-label">(Optional)</span>
                        </label>
                        <input 
                            type="text" 
                            id="state" 
                            name="state" 
                            placeholder="NY"
                        >
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="schoolName">
                            School Name
                            <span class="optional-label">(Optional)</span>
                        </label>
                        <input 
                            type="text" 
                            id="schoolName" 
                            name="schoolName" 
                            placeholder="Lincoln High School"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="grade">
                            Grade
                            <span class="optional-label">(Optional)</span>
                        </label>
                        <select id="grade" name="grade">
                            <option value="">Select Grade</option>
                            <option value="K">Kindergarten</option>
                            <option value="1">1st Grade</option>
                            <option value="2">2nd Grade</option>
                            <option value="3">3rd Grade</option>
                            <option value="4">4th Grade</option>
                            <option value="5">5th Grade</option>
                            <option value="6">6th Grade</option>
                            <option value="7">7th Grade</option>
                            <option value="8">8th Grade</option>
                            <option value="9">9th Grade</option>
                            <option value="10">10th Grade</option>
                            <option value="11">11th Grade</option>
                            <option value="12">12th Grade</option>
                        </select>
                    </div>
                </div>
                
                <div class="message" id="message"></div>
                
                <div class="button-group">
                    <button type="submit" class="submit-btn">Sign Up</button>
                    <a href="index.html" class="home-btn">← Back Home</a>
                </div>
            </form>
        </div>
        
        <div class="success-message" id="successMessage">
            <div class="success-icon">✅</div>
            <h2>Welcome!</h2>
            <p>Thank you for signing up, <span id="successName"></span>!</p>
            <p>We'll start sending you our latest pages by email soon.</p>
            <a href="index.html" class="back-home-btn">← Back to Home</a>
        </div>
    </div>
    
    <script>
        const signupForm = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');
        const formContainer = document.getElementById('formContainer');
        const successMessage = document.getElementById('successMessage');
        const successName = document.getElementById('successName');
        let signups = JSON.parse(localStorage.getItem('emailSignups')) || [];
        
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const schoolName = document.getElementById('schoolName').value.trim();
            const grade = document.getElementById('grade').value;
            
            // Validate required fields
            if (!firstName || !lastName || !email) {
                showMessage('Please fill in all required fields.', 'error');
                return;
            }
            
            // Validate email format
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }
            
            // Check if email already exists
            if (signups.some(signup => signup.email.toLowerCase() === email.toLowerCase())) {
                showMessage('This email address is already signed up.', 'error');
                return;
            }
            
            // Create signup object
            const signupObj = {
                firstName,
                lastName,
                email,
                city,
                state,
                schoolName,
                grade,
                signupDate: new Date().toLocaleString()
            };
            
            // Store signup
            signups.unshift(signupObj);
            localStorage.setItem('emailSignups', JSON.stringify(signups));
            
            // Show success message
            successName.textContent = firstName + ' ' + lastName;
            formContainer.classList.add('hidden');
            successMessage.classList.add('show');
        });
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
