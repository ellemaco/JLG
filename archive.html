<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Archive — Just A Little Goodness</title>
  <style>
    :root{--bg:#f6f2ee;--card:#fff;--steel:#1d2a3c;--muted:#5b677a;--blue:#1a74ff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--steel)}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}

    /* ── Shared nav bar ── */
    .page-shell{max-width:1220px;margin:0 auto;padding:18px 18px 28px}
    .topbar{background:rgba(255,255,255,0.82);border-radius:24px 24px 0 0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px 16px 18px;border-bottom:2px solid rgba(17,34,77,0.06)}
    .brand{display:flex;align-items:center;gap:14px;min-width:220px}
    .brand-mark{width:82px;height:82px;border-radius:50%;overflow:hidden;background:white;border:3px solid rgba(30,98,201,0.08);box-shadow:0 8px 24px rgba(11,25,52,0.08);flex-shrink:0}
    .brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
    .brand-text{line-height:0.88}
    .brand-text .name{font-size:1.1rem;font-weight:800;letter-spacing:-0.05em;color:#1d2c46}
    .brand-text .goodness{display:block;font-size:1.85rem;letter-spacing:-0.07em}
    .brand-text .subtitle{font-size:0.54rem;text-transform:uppercase;letter-spacing:0.025em;color:#5b677a;margin-top:4px}
    .main-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 26px;font-size:0.96rem;font-weight:600;color:#1c2335;flex:1}
    .main-nav a{position:relative;opacity:0.92}
    .main-nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:3px;border-radius:999px;background:var(--blue)}
    .topbar-cta{background:linear-gradient(135deg,#ff4b72 0%,#f13f5c 100%);color:white;border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:0.96rem;box-shadow:0 12px 24px rgba(255,97,131,0.28);cursor:pointer;white-space:nowrap}

    /* ── Page content ── */
    .main{background:rgba(255,255,255,0.88);border-radius:0 0 28px 28px;padding:22px 22px 18px;box-shadow:0 26px 50px rgba(16,35,74,0.08)}
    h1{font-size:1.6rem;margin:0 0 4px}
    .lead{color:var(--muted);margin-top:6px;font-size:0.97rem}

    .filters{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
    .search{padding:8px 12px;border-radius:12px;border:1px solid rgba(0,0,0,0.06);min-width:280px;font:inherit}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(11,25,52,0.06);border:1px solid rgba(20,45,72,0.04)}
    .thumb{height:160px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#333}
    .pdf-thumb{background:#f4f7fb;color:#102b59;font-size:1.1rem}
    .meta{padding:12px}
    .meta h3{margin:0;font-size:1rem}
    .meta p{margin:6px 0 0;color:var(--muted);font-size:0.92rem}
    .meta .date{font-weight:700;margin-top:8px;color:#102b59}

    .empty{padding:40px;text-align:center;color:var(--muted)}
    .page-footer{margin-top:28px;color:var(--muted);font-size:0.9rem}

    @media(max-width:1040px){.topbar{flex-wrap:wrap}.main-nav{order:3;width:100%;justify-content:flex-start}}
    @media(max-width:760px){.page-shell{padding:10px 10px 22px}.topbar{padding:14px 14px 16px;border-radius:16px 16px 0 0}.brand{min-width:0}.brand-text .name{font-size:0.95rem}.brand-text .goodness{font-size:1.45rem}.main-nav{gap:12px 18px;font-size:0.82rem}.main{padding:18px 14px 12px}}
    @media(max-width:640px){.filters{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="logo-jlg.jpg" alt="Just a Little Goodness logo"/></div>
        <div class="brand-text">
          <div class="name">Just a Little <span class="goodness">GOODNESS</span></div>
          <div class="subtitle">Real Stories. Real Good. Real Impact.</div>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="archive.html" class="active">Past Issues</a>
        <a href="email-signup.html">Subscribe</a>
        <a href="submit.html">Submit</a>
      </nav>
      <a href="email-signup.html" class="topbar-cta" role="button">Get JLG</a>
    </header>

    <main class="main">
      <h1>Past Issues</h1>
      <div class="lead">All uploaded newsletters and resources — newest first.</div>

    <div class="filters">
      <input id="searchInput" class="search" placeholder="Search uploads (title, date, tag)..." aria-label="Search uploads">
    </div>

    <div class="grid" id="archiveGrid"></div>

    <div class="empty" id="emptyMessage" style="display:none">No uploads found.</div>

    <div class="page-footer">
      Tip: To add or update items, use <a href="admin-upload.html">Manage uploads</a> (uploads are stored locally in your browser).
    </div>
    </main>
  </div>

  <script>
    // Load uploaded files from the same localStorage key used by admin-upload.html
    const STORAGE_KEY = 'uploadedFiles';
    const grid = document.getElementById('archiveGrid');
    const emptyMessage = document.getElementById('emptyMessage');
    const searchInput = document.getElementById('searchInput');

    function loadUploads() {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        items = [];
      }
      return items; // admin-upload uses unshift so items are newest-first
    }

    function renderUploads(filterText = '') {
      const uploads = loadUploads();
      const normalizedFilter = (filterText || '').toLowerCase().trim();

      const filtered = uploads.filter(u => {
        if (!normalizedFilter) return true;
        const hay = `${u.name} ${u.uploadedAt}`.toLowerCase();
        return hay.includes(normalizedFilter);
      });

      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyMessage.style.display = 'block';
        return;
      }
      emptyMessage.style.display = 'none';

      filtered.forEach((file, idx) => {
        const card = document.createElement('article');
        card.className = 'card';

        const link = document.createElement('a');
        link.href = file.data || '#';
        link.target = '_blank';
        link.rel = 'noopener';
        link.title = file.name;
        link.setAttribute('download', file.name || 'download');

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        if (file.type === 'image/png' && file.data) {
          thumb.style.backgroundImage = `url('${file.data}')`;
        } else {
          thumb.classList.add('pdf-thumb');
          thumb.textContent = 'PDF • Open / Download';
        }

        link.appendChild(thumb);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const title = document.createElement('h3');
        title.textContent = file.name || 'Untitled';
        const desc = document.createElement('p');
        desc.textContent = file.type === 'image/png' ? 'Image upload' : 'PDF newsletter';
        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = file.uploadedAt || '';

        meta.appendChild(title);
        meta.appendChild(desc);
        meta.appendChild(date);

        card.appendChild(link);
        card.appendChild(meta);

        grid.appendChild(card);
      });
    }

    // Initial render
    renderUploads();

    // Live search
    searchInput.addEventListener('input', (e) => {
      renderUploads(e.target.value);
    });

    // Watch for storage events (in case admin-upload.html is open in another tab and updates localStorage)
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) renderUploads(searchInput.value);
    });

    // Optional: observe regular polling for changes when storage events aren't available (same-tab uploads)
    // admin-upload updates localStorage in the same tab, storage event won't fire — poll every 1s and refresh if changed
    let lastSerialized = JSON.stringify(loadUploads());
    setInterval(() => {
      const current = JSON.stringify(loadUploads());
      if (current !== lastSerialized) {
        lastSerialized = current;
        renderUploads(searchInput.value);
      }
    }, 1000);
  </script>
</body>
</html>
