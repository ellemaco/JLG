<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Archive — Just A Little Goodness</title>
  <style>
    :root{--bg:#f6f2ee;--card:#fff;--steel:#1d2a3c;--muted:#5b677a}
    *{box-sizing:border-box}
    body{font-family:Segoe UI,Roboto,system-ui,-apple-system, sans-serif;background:var(--bg);color:var(--steel);margin:0}
    .page{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .brand-mark{width:60px;height:60px;border-radius:12px;overflow:hidden;background:#fff}
    .brand-mark img{width:100%;height:100%;object-fit:cover}
    h1{font-size:1.6rem;margin:0}
    .lead{color:var(--muted);margin-top:6px}

    .filters{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
    .search{padding:8px 12px;border-radius:12px;border:1px solid rgba(0,0,0,0.06);min-width:280px}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(11,25,52,0.06);border:1px solid rgba(20,45,72,0.04)}
    .thumb{height:160px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#333}
    .pdf-thumb{background:#f4f7fb;color:#102b59;font-size:1.1rem}
    .meta{padding:12px}
    .meta h3{margin:0;font-size:1rem}
    .meta p{margin:6px 0 0;color:var(--muted);font-size:0.92rem}
    .meta .date{font-weight:700;margin-top:8px;color:#102b59}

    .empty{padding:40px;text-align:center;color:var(--muted)}

    footer{margin-top:28px;color:var(--muted);font-size:0.9rem}

    @media(max-width:640px){.filters{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand-mark"><img src="logo-jlg.jpg" alt="JLG logo"/></div>
      <div>
        <h1>Archive</h1>
        <div class="lead">All uploaded newsletters and resources — newest first.</div>
      </div>
    </header>

    <div class="filters">
      <input id="searchInput" class="search" placeholder="Search uploads (title, date, tag)..." aria-label="Search uploads">
      <div class="actions"><a href="admin-upload.html">Add / Manage uploads</a></div>
    </div>

    <main>
      <div class="grid" id="archiveGrid"></div>

      <div class="empty" id="emptyMessage" style="display:none">No uploads found.</div>
    </main>

    <footer>
      Tip: To add or update items, use <a href="admin-upload.html">Manage uploads</a> (uploads are stored locally in your browser).
    </footer>
  </div>

  <script>
    // Load uploaded files from the same localStorage key used by admin-upload.html
    const STORAGE_KEY = 'uploadedFiles';
    const grid = document.getElementById('archiveGrid');
    const emptyMessage = document.getElementById('emptyMessage');
    const searchInput = document.getElementById('searchInput');

    function loadUploads() {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        items = [];
      }
      return items; // admin-upload uses unshift so items are newest-first
    }

    function renderUploads(filterText = '') {
      const uploads = loadUploads();
      const normalizedFilter = (filterText || '').toLowerCase().trim();

      const filtered = uploads.filter(u => {
        if (!normalizedFilter) return true;
        const hay = `${u.name} ${u.uploadedAt}`.toLowerCase();
        return hay.includes(normalizedFilter);
      });

      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyMessage.style.display = 'block';
        return;
      }
      emptyMessage.style.display = 'none';

      filtered.forEach((file, idx) => {
        const card = document.createElement('article');
        card.className = 'card';

        const link = document.createElement('a');
        link.href = file.data || '#';
        link.target = '_blank';
        link.rel = 'noopener';
        link.title = file.name;
        link.setAttribute('download', file.name || 'download');

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        if (file.type === 'image/png' && file.data) {
          thumb.style.backgroundImage = `url('${file.data}')`;
        } else {
          thumb.classList.add('pdf-thumb');
          thumb.textContent = 'PDF • Open / Download';
        }

        link.appendChild(thumb);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const title = document.createElement('h3');
        title.textContent = file.name || 'Untitled';
        const desc = document.createElement('p');
        desc.textContent = file.type === 'image/png' ? 'Image upload' : 'PDF newsletter';
        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = file.uploadedAt || '';

        meta.appendChild(title);
        meta.appendChild(desc);
        meta.appendChild(date);

        card.appendChild(link);
        card.appendChild(meta);

        grid.appendChild(card);
      });
    }

    // Initial render
    renderUploads();

    // Live search
    searchInput.addEventListener('input', (e) => {
      renderUploads(e.target.value);
    });

    // Watch for storage events (in case admin-upload.html is open in another tab and updates localStorage)
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) renderUploads(searchInput.value);
    });

    // Optional: observe regular polling for changes when storage events aren't available (same-tab uploads)
    // admin-upload updates localStorage in the same tab, storage event won't fire — poll every 1s and refresh if changed
    let lastSerialized = JSON.stringify(loadUploads());
    setInterval(() => {
      const current = JSON.stringify(loadUploads());
      if (current !== lastSerialized) {
        lastSerialized = current;
        renderUploads(searchInput.value);
      }
    }, 1000);
  </script>
</body>
</html>
